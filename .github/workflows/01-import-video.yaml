name: 01 - Import video

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "Direct URL of the video file to render (mp4/mkv/webm)"
        required: true
        type: string

concurrency:
  group: blur-import
  cancel-in-progress: true

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install download/validate tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg curl file

      - name: Download video
        run: |
          mkdir -p input
          curl -fL --retry 3 -o input/source "${{ inputs.source_url }}"
          ls -lh input/

      - name: Sniff container and normalize filename
        run: |
          MIME=$(file --mime-type -b input/source)
          case "$MIME" in
            video/mp4)    EXT=mp4 ;;
            video/x-matroska) EXT=mkv ;;
            video/webm)   EXT=webm ;;
            *)            EXT=bin ;;
          esac
          mv input/source "input/input.$EXT"
          echo "Container: $EXT"
          echo "Size: $(du -h "input/input.$EXT" | cut -f1)"
          echo "Duration(s): $(ffprobe -v error -show_entries format=duration -of csv=p=0 "input/input.$EXT" 2>/dev/null || echo unknown)"

      - name: Upload input artifact
        uses: actions/upload-artifact@v4
        with:
          name: blur-input
          path: input/input.*

      - name: Write Job Summary
        run: |
          {
            echo "## Input received"
            echo "- URL: ${{ inputs.source_url }}"
            echo "- Size: $(du -h input/input.* | cut -f1)"
          } >> "$GITHUB_STEP_SUMMARY"
