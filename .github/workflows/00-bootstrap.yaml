name: 00 - Bootstrap toolchain

on:
  workflow_dispatch:
    inputs:
      force_refresh:
        description: "Rebuild from scratch (pick up new fork source / clear cache)"
        required: false
        default: "false"
        type: boolean

concurrency:
  group: blur-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout fork source (with submodules)
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Linux build deps + runtime tools (minimal)
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libx11-dev libxcursor-dev libxinerama-dev libxi-dev libxrandr-dev \
            libgl1-mesa-dev libfontconfig1-dev libnotify-dev libncurses6 \
            gcc-13 g++-13 autoconf automake libtool pkg-config libltdl-dev \
            ninja-build gperf ffmpeg jq
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-13 100 --slave /usr/bin/g++ g++ /usr/bin/g++-13
          sudo update-alternatives --set gcc /usr/bin/gcc-13
          pip install VapourSynth --break-system-packages
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          vspipe --version

      - name: Report upstream latest version (informational)
        run: |
          curl -s https://api.github.com/repos/f0e/blur/releases/latest | jq -r .tag_name > latest.txt
          echo "Building fork source; upstream latest release: $(cat latest.txt)"

      - name: Build blur-cli from fork source + assemble stripped runtime
        run: |
          chmod +x .github/scripts/build-cli.sh
          ./.github/scripts/build-cli.sh

      - name: Self-test the runtime (pure-blur safe)
        run: |
          ffmpeg -y -f lavfi -i "testsrc2=size=640x360:rate=30:duration=2" -c:v libx264 -pix_fmt yuv420p bs.mp4
          printf 'blur: true\nblur amount: 1\nblur output fps: 60\ninterpolate: false\ndeduplicate: false\ngpu decoding: false\ngpu interpolation: false\ngpu encoding: false\npreview: false\nquality: 18\nvideo container: mp4\n' > safe.cfg
          runtime/blur-cli -i bs.mp4 -o bs-out.mp4 -c safe.cfg -v
          echo "Self-test output duration: $(ffprobe -v error -show_entries format=duration -of csv=p=0 bs-out.mp4) s"

      - name: Save toolchain to cache
        uses: actions/cache/save@v5
        with:
          path: runtime
          key: blur-toolchain-v2.45
